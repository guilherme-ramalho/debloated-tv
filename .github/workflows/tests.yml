name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the tests need no write access, and pull requests from forks get none.
# Actions are pinned to commit SHAs (the comment names the version); Dependabot (.github/dependabot.yml) bumps them.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: iPhone app core (swift test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Xcode 26
        # The app uses iOS 26 APIs (widget IntentModes); the runner's default Xcode is older. Picks the newest
        # Xcode 26 the runner has, as the Mac it's developed on uses.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Unit tests
        working-directory: ios
        run: swift test

  launcher:
    name: TV launcher (gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        working-directory: tv-launcher/launcher
        run: ./gradlew --no-daemon testReleaseUnitTest

  ui:
    name: iPhone app UI smoke tests (simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Xcode 26
        # The app uses iOS 26 APIs (widget IntentModes); the runner's default Xcode is older. Picks the newest
        # Xcode 26 the runner has, as the Mac it's developed on uses.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: UI tests
        working-directory: ios
        run: |
          # Skipped until the TVRemoteUITests target is added to the Xcode project (docs/TESTING.md, "Automated tests").
          grep -q TVRemoteUITests TVRemote.xcodeproj/project.pbxproj || { echo "No UI test target yet: skipping."; exit 0; }
          # The first available iPhone simulator, booted with one photo in its library (Show on TV needs one, CST-04).
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl addmedia "$udid" Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodebuild test -project TVRemote.xcodeproj -scheme "Debloated TV Dev" \
            -destination "id=$udid" \
            -only-testing:TVRemoteUITests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
